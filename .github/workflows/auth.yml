name: Autorizar TikTok
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Código de la página de callback (déjalo vacío para ver el enlace de autorización)"
        required: false
concurrency: lamina-bot
permissions:
  contents: write
jobs:
  auth:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "lamina-bot"
          git config user.email "lamina-bot@users.noreply.github.com"
      - if: inputs.code == ''
        run: python -m bot.main auth-url
      - if: inputs.code != ''
        run: python -m bot.main auth-code "$CODE"
        env:
          CODE: ${{ inputs.code }}
      - if: inputs.code != ''
        run: git add -A && (git diff --cached --quiet || git commit -m "Token de TikTok guardado") && git push
