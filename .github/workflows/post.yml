name: Preparar carrusel
on:
  schedule:
    # Lunes, miércoles y viernes. Dos horas UTC para cubrir horario de invierno y de verano;
    # el script solo actúa a partir de las 17:30 de Madrid y una vez al día.
    - cron: "25 15 * * 1,3,5"
    - cron: "25 16 * * 1,3,5"
  workflow_dispatch:
    inputs:
      force:
        description: "Generar y enviar ya, aunque hoy no toque"
        type: boolean
        default: false
concurrency: lamina-bot
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "lamina-bot"
          git config user.email "lamina-bot@users.noreply.github.com"
      - id: prep
        run: python -m bot.main prepare ${{ inputs.force && '--force' || '' }}
      - if: steps.prep.outputs.prepared == 'true'
        run: git add -A && (git diff --cached --quiet || git commit -m "Carrusel preparado") && git push
      - if: steps.prep.outputs.prepared == 'true'
        run: python -m bot.main upload
      - if: always() && steps.prep.outputs.prepared == 'true'
        run: git pull --rebase && git add -A && (git diff --cached --quiet || git commit -m "Carrusel enviado a TikTok") && git push
