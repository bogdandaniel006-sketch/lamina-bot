name: Preparar carrusel
on:
  schedule:
    # Todos los días. GitHub retrasa o se salta a veces las tareas programadas, así que
    # se intenta cada 20 minutos de 15:10 a 21:50 UTC; el script solo actúa a partir de las
    # 17:20 de Madrid y una sola vez al día (si ya hay carrusel hoy, termina en segundos).
    - cron: "10,30,50 15-21 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Generar y enviar ya, aunque hoy no toque"
        type: boolean
        default: false
concurrency: lamina-bot
permissions:
  contents: write
  issues: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "lamina-bot"
          git config user.email "lamina-bot@users.noreply.github.com"
      - id: prep
        run: python -m bot.main prepare ${{ inputs.force && '--force' || '' }}
      - if: steps.prep.outputs.prepared == 'true'
        run: git add -A && (git diff --cached --quiet || git commit -m "Carrusel preparado"); git pull --rebase && git push
      - if: steps.prep.outputs.prepared == 'true'
        run: python -m bot.main upload
      - if: always() && steps.prep.outputs.prepared == 'true'
        run: git add -A && (git diff --cached --quiet || git commit -m "Carrusel enviado a TikTok"); git pull --rebase && git push
      - if: success() && steps.prep.outputs.prepared == 'true'
        name: Avisar por email (issue de GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          h = json.load(open("data/history.json"))[-1]
          base = os.environ["PAGES_BASE"]
          imgs = "".join(f'<img src="{base}/media/{h["id"]}/{i}.jpg" width="200"> ' for i in (1, 2, 3))
          body = (f"📲 **Tienes un carrusel nuevo en TikTok.** Abre la app con @danidemiguel_ → Bandeja de entrada → "
                  f"Notificaciones del sistema → *Edita tu vídeo antes de compartirlo*, y publícalo.\n\n"
                  f"**Título:** {h['title']}\n\n{imgs}\n\n**Textos:** " + " / ".join(h["texts"]) +
                  f"\n\n_Formato {h['format']} · escena {h['scene']} · gancho {h['hook']}_")
          open("aviso.md", "w").write(body)
          PY
          gh issue create --title "📲 Carrusel listo para publicar - $(TZ=Europe/Madrid date +%d/%m)" --body-file aviso.md --assignee "${{ github.repository_owner }}"
