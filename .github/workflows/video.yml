name: Hacer vídeo
on:
  workflow_dispatch:
    inputs:
      guion:
        description: "Guion de video/historias (sin .json)"
        required: true
      modo:
        description: "vista_previa = solo generar (se descarga desde Actions) · tiktok = enviar a la bandeja de TikTok"
        type: choice
        options: [vista_previa, tiktok]
        default: vista_previa
      voces:
        description: "Generar también muestras de todas las voces"
        type: boolean
        default: false
concurrency: lamina-bot
permissions:
  contents: write
  issues: write
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            video/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libfontconfig1 > /dev/null
      - run: pip install -r requirements.txt -r video/requirements.txt
      - run: |
          git config user.name "lamina-bot"
          git config user.email "lamina-bot@users.noreply.github.com"
      - name: Renderizar vídeo
        run: python video/video.py render "video/historias/${{ inputs.guion }}.json"
      - if: inputs.voces
        name: Muestras de voces
        run: python video/muestras_voz.py video/salida/voces
      - if: inputs.modo == 'vista_previa'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.guion }}
          path: video/salida/
          retention-days: 7
      - if: inputs.modo == 'vista_previa'
        name: Guardar la vista previa en la rama 'vista-previa'
        run: |
          mkdir -p /tmp/vp && cp -r video/salida/. /tmp/vp/ && cd /tmp/vp
          git init -q -b vista-previa && git add -A
          git -c user.name=lamina-bot -c user.email=lamina-bot@users.noreply.github.com commit -qm "Vista previa: ${{ inputs.guion }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vista-previa
      - if: inputs.modo == 'tiktok'
        id: subir
        name: Enviar a la bandeja de TikTok
        run: python -m bot.main upload-video "video/salida/${{ inputs.guion }}.mp4" "video/historias/${{ inputs.guion }}.json"
      - if: always() && inputs.modo == 'tiktok'
        run: git add data && (git diff --cached --quiet || git commit -m "Vídeo enviado a TikTok"); git pull --rebase && git push
      - if: success() && inputs.modo == 'tiktok'
        name: Avisar por email (issue de GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            if [ "${{ steps.subir.outputs.modo }}" = "privado" ]; then
              echo "🎬 **Vídeo nuevo publicado en privado en TikTok**, ya con su texto y hashtags. Abre la app con @danidemiguel_ → tu perfil → el vídeo (con el candado) → ··· → Configuración de privacidad → Todos, para hacerlo público."
            else
              echo "🎬 **Tienes un vídeo nuevo en la bandeja de TikTok** (borrador). Abre la app con @danidemiguel_ → Bandeja de entrada → Notificaciones del sistema, pega el texto de abajo y publícalo."
            fi
            echo
            echo "**Texto de la publicación:**"
            echo
            echo '```'
            python3 -c "import json;g=json.load(open('video/historias/${{ inputs.guion }}.json'));print(g.get('descripcion_tiktok') or g.get('titulo',''))"
            echo '```'
          } > aviso.md
          gh issue create --title "🎬 Vídeo nuevo en TikTok - $(TZ=Europe/Madrid date +%d/%m)" --body-file aviso.md --assignee "${{ github.repository_owner }}"
