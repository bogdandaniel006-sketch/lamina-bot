name: Métricas y aprendizaje
on:
  schedule:
    - cron: "10 7 * * *"
    - cron: "40 12 * * *"
  workflow_dispatch:
concurrency: lamina-bot
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "lamina-bot"
          git config user.email "lamina-bot@users.noreply.github.com"
      - run: python -m bot.main metrics
      - if: always()
        run: git add -A && (git diff --cached --quiet || git commit -m "Métricas actualizadas"); git pull --rebase && git push
