<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Autorización TikTok</title>
<body style="font-family:sans-serif;padding:24px;max-width:640px">
<h2>Autorización de TikTok</h2>
<p>Copia este código y pégalo en el workflow <b>Autorizar TikTok</b> de GitHub (o pásaselo a Claude):</p>
<textarea id="c" style="width:100%;height:120px;font-size:14px" readonly></textarea>
<button onclick="navigator.clipboard.writeText(document.getElementById('c').value)">Copiar</button>
<p id="e" style="color:#c00"></p>
<script>
const p=new URLSearchParams(location.search);
document.getElementById('c').value=p.get('code')||'';
if(p.get('error')) document.getElementById('e').textContent='Error: '+p.get('error')+' '+(p.get('error_description')||'');
</script></body>
